# =============================================================================
# Avodah Contractors — Netlify config
# Ignored on Apache/cPanel hosting (see .htaccess for that).
# Netlify serves 404.html automatically and handles HTTPS + HSTS itself;
# set the canonical domain under Site settings -> Domain management.
# =============================================================================

[build]
  publish = "."

# Homepage has one URL, matching <link rel="canonical" href="https://avodahcontractors.com/">
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

# Photos, video and icons never change in place — cache them hard.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The build guide is a static download that changes rarely; cache it hard so
# repeat visitors and email recipients don't re-pull a megabyte each time.
[[headers]]
  for = "/guides/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# styles.css and script.js are not content-hashed, so a long TTL would strand
# visitors on an old build after an edit.
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
